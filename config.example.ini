; RBG Photography website settings.
; Copy this file to config.ini and edit it:   cp config.example.ini config.ini
; Restart the site after changes:             sudo systemctl restart rbg-website

[server]
; 0.0.0.0 = reachable from other devices on your home network
host = 0.0.0.0
port = 8080
; The public address of the site (used for links in Google results and social previews).
site_url = http://raspberrypi.local:8080
; Set to true only when running behind Caddy/nginx or a Cloudflare Tunnel.
trust_proxy = false
; Leave blank to auto-generate one in data/secret.key
secret_key =

[business]
name = RBG Photography
photographer = Rachel Goff
email = hello@example.com
phone =
city = Woodstock
region = MD
service_area = Howard, Baltimore & Carroll Counties
instagram =
facebook =
; Payment link for deposits (Square, PayPal, Venmo, HoneyBook...) and the usual amount.
; Both fill in the booking confirmation email; you can change them per session.
deposit_link =
deposit = $50

[admin]
; Rachel's login for /admin (where booking requests show up).
; /admin stays switched off until a password is set here.
username = rachel
password =

[email]
; Optional: email Rachel whenever a booking request arrives.
; For Gmail use smtp.gmail.com, port 587, and an "app password".
enabled = false
smtp_host = smtp.gmail.com
smtp_port = 587
smtp_user =
smtp_password =
from_address =
notify_address =
